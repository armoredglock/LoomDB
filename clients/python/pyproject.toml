[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loomdb"
version = "0.1.0"
authors = [
  { name="LoomDB Authors", email="dev@loomdb.dev" },
]
description = "Official Python driver for LoomDB - The lightweight multi-modal AI database"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Database",
]
keywords = ["database", "vector", "ai", "sql", "timeseries", "loomdb"]

[project.urls]
"Homepage" = "https://loomdb.dev"
"Repository" = "https://github.com/armoredglock/LoomDB"
