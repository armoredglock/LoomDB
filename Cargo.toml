[workspace]
members = [
    "crates/loom-core",
    "crates/loom-storage",
    "crates/loom-index",
    "crates/loom-query",
    "crates/loom-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["LoomDB Authors"]
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/loomdb/loomdb"
repository = "https://github.com/loomdb/loomdb"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
debug = true
