[package]
name = "loom-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
loom-core = { path = "../loom-core" }
loom-storage = { path = "../loom-storage" }
loom-index = { path = "../loom-index" }
loom-query = { path = "../loom-query" }
bytes = "1.5"
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
